<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2 - Tema 3: Lugares</title>
    <style>
        body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:0;text-align:center}
        header{background:#2a5298;color:#fff;padding:40px 15px;margin-bottom:20px}
        .contenedor{max-width:900px;margin:0 auto;padding: 0 20px;}
        .seccion{background:#fff;padding:20px;margin-bottom:15px;border-radius:10px;border-left:6px solid #ff9800;text-align:left}
        h2{color:#2a5298}
        .ejercicio{margin:15px 0;padding:12px;background:#f8f9fa;border-radius:8px}
        .opciones label{display:block;margin:6px 0;cursor:pointer;}
        .opciones input[type="radio"] {margin-right: 8px;}
        input[type="text"]{padding:6px 10px;border:1px solid #ccc;border-radius:4px;width:150px}
        
        /* Botones y espaciado corregidos */
        .btn-comprobar{background:#ff9800;color:#fff;padding:12px 30px;border:none;border-radius:5px;cursor:pointer;margin:20px 0;font-weight:bold;font-size:1em;}
        .btn-comprobar:hover{background:#e68900;}
        .resultado{padding:15px;margin:15px 0;border-radius:5px;display:none;text-align:left;}
        .resultado.correcto{background:#d4edda;color:#155724}
        .resultado.incorrecto{background:#f8d7da;color:#721c24}
        .btn-regresar{background:#2a5298;color:#fff;padding:10px 22px;border-radius:5px;text-decoration:none;display:inline-block;margin:30px 0 20px 0;}
        .btn-regresar:hover{background:#1a3c73;}
        
        .drag-container{display:flex;gap:20px;margin:15px 0;justify-content:center;flex-wrap:wrap}
        .draggable{background:#ff9800;color:#fff;padding:10px 15px;border-radius:5px;cursor:grab;display:inline-block;margin:5px;font-weight:bold}
        .draggable:active{cursor:grabbing}
        .drop-area{border:2px dashed #2a5298;background:#f8f9fa;padding:15px;min-width:150px;min-height:50px;border-radius:8px;text-align:center;margin:5px;display:inline-block}
        .drop-area.drag-over{background:#e8f0fe;border-color:#ff9800}
        .match-container{display:flex;justify-content:space-around;flex-wrap:wrap;margin:15px 0}
        .match-column{display:flex;flex-direction:column;gap:10px}
        .match-item{background:#e9ecef;padding:10px 20px;border-radius:5px;cursor:pointer;text-align:center}
        .match-item.selected{background:#2a5298;color:#fff}
        .match-item.matched{background:#28a745;color:#fff;opacity:0.7}
        .match-item.wrong{background:#dc3545;color:#fff}
        .pairs-display{margin-top:15px}
        .pair-item{background:#e9ecef;padding:8px;margin:5px;border-radius:5px;display:inline-block}
    </style>
</head>
<body>
<header><h1>Nivel A2 - Tema 3: Lugares y Transporte</h1></header>
<div class="contenedor">
    <div class="seccion"><h2>GRAMÁTICA</h2>

        <div class="ejercicio"><p>2. Choose: "She is ________ (at/in/on) the cinema."</p><div class="opciones"><label><input type="radio" name="g2" value="c">at</label><label><input type="radio" name="g2" value="a">in</label><label><input type="radio" name="g2" value="b">on</label></div></div>
